services:
  mysql:
    image: mysql:8.0
    container_name: poiseathome_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-poiseathome_db}
      MYSQL_USER: ${MYSQL_USER:-poiseathome_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_this_db_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - poise_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: poiseathome_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - poise_network

  minio:
    image: minio/minio:latest
    container_name: poiseathome_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - poise_network

  minio-init:
    image: minio/mc:latest
    container_name: poiseathome_minio_init
    restart: "no"
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000
      $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set download local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-poiseathome-images}
    networks:
      - poise_network

  backend:
    build:
      context: ./poiseathomebackend
      dockerfile: Dockerfile
    container_name: poiseathome_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_DATABASE:-poiseathome_db}
      - DB_USERNAME=${MYSQL_USER:-poiseathome_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-change_this_db_password}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-localhost:3000,127.0.0.1:3000}
      - SESSION_DOMAIN=${SESSION_DOMAIN:-localhost}
      - BREVO_API_KEY=${BREVO_API_KEY:apikey}
      - BREVO_FROM_EMAIL=${BREVO_FROM_EMAIL:-noreply@poiseathome.site}
      - BREVO_FROM_NAME=${BREVO_FROM_NAME:-PoiseAtHome}
      - POISE_AUTH_CODE_EXPIRATION_MINUTES=${POISE_AUTH_CODE_EXPIRATION_MINUTES:-15}
      - POISE_RESET_AUTHORIZATION_MINUTES=${POISE_RESET_AUTHORIZATION_MINUTES:-10}
      - POISE_OPENING_TIME=${POISE_OPENING_TIME:-09:00}
      - POISE_CLOSING_TIME=${POISE_CLOSING_TIME:-18:00}
      - POISE_SLOT_INTERVAL_MINUTES=${POISE_SLOT_INTERVAL_MINUTES:-30}
      - POISE_MIN_NOTICE_HOURS=${POISE_MIN_NOTICE_HOURS:-2}
      - POISE_MAX_ADVANCE_DAYS=${POISE_MAX_ADVANCE_DAYS:-60}
      - POISE_DOWNPAYMENT_PERCENTAGE=${POISE_DOWNPAYMENT_PERCENTAGE:-30}
      - PAYMENT_GCASH_ENABLED=${PAYMENT_GCASH_ENABLED:-true}
      - GCASH_ACCOUNT_NAME=${GCASH_ACCOUNT_NAME:-Poise Hair Center}
      - GCASH_ACCOUNT_NUMBER=${GCASH_ACCOUNT_NUMBER:-09123456789}
      - PAYMENT_BANK_ENABLED=${PAYMENT_BANK_ENABLED:-false}
      - BANK_ACCOUNT_NAME=${BANK_ACCOUNT_NAME:-}
      - BANK_ACCOUNT_NUMBER=${BANK_ACCOUNT_NUMBER:-}
      - BANK_NAME=${BANK_NAME:-}
      - ADMIN_NAME=${ADMIN_NAME:-PoiseAtHome Administrator}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@gmail.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin1234}
      - DEMO_STAFF_PASSWORD=${DEMO_STAFF_PASSWORD:-Staff123!}
      - DEMO_CUSTOMER_PASSWORD=${DEMO_CUSTOMER_PASSWORD:-Customer123!}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=${MINIO_BUCKET:-poiseathome-images}
      - AWS_URL=${VITE_MEDIA_BASE_URL:-http://localhost:9000/poiseathome-images}
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
    command: >-
      sh -c "php artisan config:clear &&
      php artisan migrate --force &&
      php artisan db:seed --force &&
      cd public &&
      exec php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - poise_network
    volumes:
      - ./poiseathomebackend:/var/www/html
      - /var/www/html/vendor
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./poiseathomefrontend
      dockerfile: Dockerfile
    container_name: poiseathome_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      - VITE_MEDIA_BASE_URL=${VITE_MEDIA_BASE_URL:-http://localhost:9000/poiseathome-images}
    depends_on:
      - backend
    networks:
      - poise_network
    volumes:
      - ./poiseathomefrontend:/app
      - /app/node_modules

networks:
  poise_network:
    driver: bridge

volumes:
  mysql_data:
  minio_data:
